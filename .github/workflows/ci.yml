name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            laravel: '12.*'
            testbench: '^10.0'
          - php-version: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
          - php-version: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
          - php-version: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
          - php-version: '8.4'
            laravel: '13.*'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.4' && 'xdebug' || 'none' }}

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-

      - name: Pin packages to Laravel ${{ matrix.laravel }}
        run: |
          composer require \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - run: mkdir -p build/logs

      - run: composer test

      - run: composer stan

      - run: composer coverage
        if: matrix.php-version == '8.4'

      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - uses: actions/upload-artifact@v4
        if: always() && matrix.php-version == '8.4'
        with:
          name: phpunit-coverage-${{ matrix.php-version }}-laravel-${{ matrix.laravel == '12.*' && '12' || '13' }}
          path: build/logs/clover.xml
